const dayShort=Array.from({length:7},(_,i)=>t('day_short_'+i));
const colors=['#529bcc','#eea147','#dd786e','#8a83c9','#61aa91','#c1974c'];
const initial=()=>({schemaVersion:1,presets:[{id:'sleep',nameKey:'preset_sleep',temp:16,color:colors[0]},{id:'home',nameKey:'preset_home',temp:19,color:colors[1]},{id:'evening',nameKey:'preset_evening',temp:21,color:colors[2]}],days:Array.from({length:7},(_,i)=>({base:'sleep',periods:i<5?[{start:'07:00',end:'10:00',preset:'home'},{start:'17:00',end:'23:00',preset:'evening'}]:[{start:'08:00',end:'18:00',preset:'home'},{start:'18:00',end:'23:00',preset:'evening'}]})),selected:0});
let state=initial();let dirty=false;let dialogKind=null;
const stored=window.openai?.widgetState?.privateContent?.schedule;
const storedLanguage=window.openai?.widgetState?.privateContent?.language;
if(storedLanguage){language=storedLanguage;i18n=createLocalizer(catalogs,language);}
if(stored&&Array.isArray(stored.presets)&&stored.presets.length&&Array.isArray(stored.days)&&stored.days.length===7)state=stored;
function normalize(){
 if(state.schemaVersion!==1){
  for(const presets of [state.presets,state.applied?.presets||[]])for(const p of presets){
   const key='preset_'+p.id;
   if(catalogs.en[key]&&[catalogs.en[key],catalogs.ru[key]].includes(p.name)){p.nameKey=key;delete p.name;}
  }
  state.schemaVersion=1;
 }
 state.control={mode:'auto',manualTarget:21,override:null,source:'external',childLock:false,openWindow:false,frost:7,...state.control};
 if(!state.applied)state.applied=JSON.parse(JSON.stringify({presets:state.presets,days:state.days}));
}
normalize();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getPreset=id=>state.presets.find(p=>p.id===id)||state.presets[0];
const fmt=n=>i18n.number(n)+' °C';
const minutes=t=>t==='24:00'?1440:Number(t.slice(0,2))*60+Number(t.slice(3));
const clock=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const icons=()=>{root.querySelectorAll('button,summary').forEach(el=>el.classList.add('cursor-interaction'));if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});};
function remember(){window.openai?.setWidgetState?.({modelContent:{language:i18n.language,temperatures:state.presets.map(p=>({name:presetName(p),temp:p.temp})),selectedDay:dayNames[state.selected],mode:state.control.mode,target:targetValue(),temporaryOverride:state.control.override!==null},privateContent:{schedule:state,language}})?.catch(()=>{});}
function changed(){dirty=true;$('#save-status').textContent=t('unsaved');remember();}
function options(id){return state.presets.map(p=>`<option value="${esc(p.id)}" ${p.id===id?'selected':''}>${esc(presetName(p))} · ${fmt(p.temp)}</option>`).join('');}

function localizeStatic(){
 root.lang=i18n.language;
 dayNames.splice(0,7,...Array.from({length:7},(_,i)=>t('day_'+i)));
 dayShort.splice(0,7,...Array.from({length:7},(_,i)=>t('day_short_'+i)));
 root.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
 root.querySelectorAll('[data-i18n-aria-label]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAriaLabel)));
 root.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.setAttribute('placeholder',t(el.dataset.i18nPlaceholder)));
 $('#preview-language').value=i18n.language;
 $('#save-status').textContent=t(dirty?'unsaved':'demo_changes');
}

function render(){
 localizeStatic();
 renderControl();
 $('#temperature-list').innerHTML=state.presets.map(p=>`<div class="temperature-row"><span class="temperature-dot" style="--preset-color:${p.color}"></span><span class="temperature-name">${esc(presetName(p))}</span><span class="temperature-value">${fmt(p.temp)}</span><button type="button" class="icon-button" data-edit="${esc(p.id)}" aria-label="${esc(t('edit_named',{name:presetName(p)}))}"><i data-lucide="pencil" aria-hidden="true"></i></button></div>`).join('');
 $('#day-picker').innerHTML=dayShort.map((d,i)=>`<button type="button" data-day="${i}" aria-pressed="${i===state.selected}" aria-label="${dayNames[i]}">${d}</button>`).join('');
 const day=state.days[state.selected];$('#day-title').textContent=dayNames[state.selected];$('#day-count').textContent=t('period_count',{count:day.periods.length});
 $('#base-temperature').innerHTML=options(day.base);
 $('#timeline').style.background=getPreset(day.base).color;
 $('#timeline').innerHTML=day.periods.map((p,i)=>`<div class="timeline-segment" data-period-segment="${i}" style="left:${minutes(p.start)/14.4}%;width:${(minutes(p.end)-minutes(p.start))/14.4}%;--preset-color:${getPreset(p.preset).color}" aria-label="${p.start}–${p.end}, ${esc(presetName(getPreset(p.preset)))}, ${fmt(getPreset(p.preset).temp)}"></div>`).join('');
 $('#period-list').innerHTML=day.periods.map((p,i)=>`<div class="period" data-period="${i}"><div class="period-main"><div class="period-times"><input type="time" value="${p.start}" step="900" data-field="start" aria-label="${t('period_start',{count:i+1})}"><span>—</span><input type="time" value="${p.end==='24:00'?'00:00':p.end}" step="900" data-field="end" aria-label="${t('period_end',{count:i+1})}"></div><label class="period-preset"><span class="temperature-dot" style="--preset-color:${getPreset(p.preset).color}"></span><select data-field="preset" aria-label="${t('period_temperature',{count:i+1})}">${options(p.preset)}</select></label></div><button type="button" class="icon-button" data-delete-period="${i}" aria-label="${t('period_delete',{count:i+1})}"><i data-lucide="x" aria-hidden="true"></i></button></div>`).join('');
 icons();
}
const demoDay=2,demoMinute=20*60+30;
function planAt(dayIndex,time){
 const day=state.applied.days[dayIndex];
 const period=day.periods.find(p=>minutes(p.start)<=time&&time<minutes(p.end));
 return state.applied.presets.find(p=>p.id===(period?.preset||day.base))||state.applied.presets[0];
}
function nextTransition(){
 const active=planAt(demoDay,demoMinute);
 for(let offset=0;offset<8;offset++){
  const index=(demoDay+offset)%7,day=state.applied.days[index];
  const boundaries=[...new Set([0,...day.periods.flatMap(p=>[minutes(p.start),minutes(p.end)])])].filter(m=>m<1440).sort((a,b)=>a-b);
  for(const m of boundaries){if(offset===0&&m<=demoMinute)continue;const preset=planAt(index,m);if(preset.id!==active.id||preset.temp!==active.temp)return {time:clock(m),preset,offset,index};}
 }
 return null;
}
function targetValue(){return state.control.mode==='auto'?(state.control.override??planAt(demoDay,demoMinute).temp):state.control.mode==='heat'?state.control.manualTarget:null;}
function renderControl(){
 const c=state.control,active=planAt(demoDay,demoMinute),next=nextTransition(),target=targetValue();
 const current=c.source==='external'?19.8:21.2;
 $('#current-temperature').textContent=i18n.number(current,{minimumFractionDigits:1});
 $('#target-temperature').textContent=target===null?'—':fmt(target);
 $('#target-down').disabled=target===null||target<=4;$('#target-up').disabled=target===null||target>=35;
 const heating=target!==null&&target>current;
 $('#heating-status').classList.toggle('is-idle',!heating);
 $('#heating-status').innerHTML=`<i data-lucide="${heating?'flame':c.mode==='off'?'power':'check'}" aria-hidden="true"></i>${heating?t('heating'):c.mode==='off'?t('off'):t('target_reached')}`;
 root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===c.mode)));
 const nextTime=next?(next.offset===0?next.time:`${dayShort[next.index]}, ${next.time}`):'';
 $('#target-context').textContent=c.mode==='auto'?(c.override!==null?(next?t('until_then',{time:nextTime,temperature:fmt(next.preset.temp)}):t('until_next')):t('scheduled_preset',{name:presetName(active)})):c.mode==='heat'?t('manual_mode'):t('frost_value',{temperature:fmt(c.frost)});
 $('#next-event-label').textContent=c.mode==='auto'?(c.override!==null?t('temporary_override'):next?t('next_period',{time:nextTime,name:presetName(next.preset)}):t('constant_week')):c.mode==='heat'?t('schedule_paused'):t('frost_protection');
 $('#next-event-detail').textContent=c.mode==='auto'?(c.override!==null?t('resume_next'):next?t('next_temperature',{temperature:fmt(next.preset.temp)}):t('constant_temperature',{temperature:fmt(active.temp)})):c.mode==='heat'?t('resume_auto'):t('minimum_temperature',{temperature:fmt(c.frost)});
 $('#resume-schedule').hidden=!(c.mode==='auto'&&c.override!==null);
 $('#child-lock').checked=c.childLock;$('#open-window').checked=c.openWindow;$('#temperature-source').value=c.source;$('#frost-temperature').value=c.frost;
 $('#settings-summary').textContent=`${c.source==='external'?t('external_sensor'):t('internal_sensor')}${c.childLock?' · '+t('dial_locked'):''}`;
 $('#schedule-summary').textContent=t('schedule_count',{count:state.applied.presets.length});
}
function error(text){$('#schedule-error').hidden=!text;$('#schedule-error').textContent=text;}
function validate(periods){const sorted=[...periods].sort((a,b)=>minutes(a.start)-minutes(b.start));for(let i=0;i<sorted.length;i++){if(!/^\d\d:\d\d$/.test(sorted[i].start)||!/^\d\d:\d\d$/.test(sorted[i].end)||minutes(sorted[i].start)>=minutes(sorted[i].end))return t('invalid_period');if(i&&minutes(sorted[i].start)<minutes(sorted[i-1].end))return t('overlap');}return '';}
function closeDialog(){const layer=$('#dialog-layer');layer.hidden=true;layer.innerHTML='';dialogKind=null;}
function showPreset(id){
 const preset=id?getPreset(id):{name:'',temp:20};dialogKind='preset';
 $('#dialog-layer').innerHTML=`<section class="ha-dialog" role="dialog" aria-modal="true" aria-labelledby="temperature-dialog-title"><h3 id="temperature-dialog-title">${id?t('edit_temperature'):t('new_temperature')}</h3><label class="field-label" for="preset-name">${t('name')}</label><input class="name-input" id="preset-name" maxlength="28" placeholder="${t('name_placeholder')}" value="${esc(presetName(preset))}"><label class="field-label" for="preset-temp">${t('temperature_celsius')}</label><div class="temperature-stepper"><button type="button" class="icon-button" data-step="-0.5" aria-label="${t('temperature_down')}"><i data-lucide="minus" aria-hidden="true"></i></button><input type="number" id="preset-temp" min="4" max="35" step="0.5" value="${preset.temp}"><button type="button" class="icon-button" data-step="0.5" aria-label="${t('temperature_up')}"><i data-lucide="plus" aria-hidden="true"></i></button></div><div class="error-message" id="preset-error" role="alert" hidden></div><div class="dialog-actions">${id&&state.presets.length>1?`<button class="text-button delete-button" type="button" id="delete-preset">${t('delete')}</button>`:''}<button class="text-button" type="button" data-close>${t('cancel')}</button><button class="primary-button" type="button" id="confirm-preset">${t('done')}</button></div></section>`;
 $('#dialog-layer').hidden=false;icons();$('#preset-name').focus();
 $('#confirm-preset').onclick=()=>{const name=$('#preset-name').value.trim(),temp=Number($('#preset-temp').value);if(!name||!Number.isFinite(temp)||temp<4||temp>35||temp*2!==Math.round(temp*2)){const e=$('#preset-error');e.hidden=false;e.textContent=t('invalid_temperature');return;}if(id){const existing=getPreset(id);if(existing.nameKey&&name===presetName(existing)){existing.temp=temp;}else{Object.assign(existing,{name,temp});delete existing.nameKey;}}else state.presets.push({id:'p'+Date.now(),name,temp,color:colors[state.presets.length%colors.length]});changed();closeDialog();render();};
 if($('#delete-preset'))$('#delete-preset').onclick=()=>{const used=state.days.some(d=>d.base===id||d.periods.some(p=>p.preset===id));if(used){const e=$('#preset-error');e.hidden=false;e.textContent=t('temperature_in_use');return;}state.presets=state.presets.filter(p=>p.id!==id);changed();closeDialog();render();};
}
function showCopy(){
 dialogKind='copy';$('#dialog-layer').innerHTML=`<section class="ha-dialog" role="dialog" aria-modal="true" aria-labelledby="copy-title"><h3 id="copy-title">${t('copy_day')}</h3><p class="copy-note">${t('copy_note',{day:dayNames[state.selected]})}</p>${dayNames.map((d,i)=>i===state.selected?'':`<label class="copy-choice"><input type="checkbox" value="${i}" ${state.selected<5&&i<5?'checked':''}><span>${d}</span></label>`).join('')}<div class="dialog-actions"><button class="text-button" type="button" data-close>${t('cancel')}</button><button class="primary-button" type="button" id="confirm-copy">${t('copy')}</button></div></section>`;$('#dialog-layer').hidden=false;$('#confirm-copy').onclick=()=>{const checked=[...root.querySelectorAll('.copy-choice input:checked')];if(!checked.length)return;checked.forEach(c=>state.days[Number(c.value)]=JSON.parse(JSON.stringify(state.days[state.selected])));changed();closeDialog();render();$('#save-status').textContent=t('copied');};
}
root.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;
 if(button.hasAttribute('data-mode')){
  if(button.dataset.mode==='heat')state.control.manualTarget=targetValue()??state.control.manualTarget;
  state.control.mode=button.dataset.mode;state.control.override=null;renderControl();icons();remember();
 }
 if(button.id==='target-up'||button.id==='target-down'){
  const target=targetValue();if(target===null)return;
  const value=Math.min(35,Math.max(4,target+(button.id==='target-up'?0.5:-0.5)));
  if(state.control.mode==='auto')state.control.override=value;else state.control.manualTarget=value;
  renderControl();icons();remember();
 }
 if(button.id==='resume-schedule'){state.control.override=null;renderControl();icons();remember();}
 if(button.hasAttribute('data-edit'))showPreset(button.dataset.edit);
 if(button.id==='add-temperature')showPreset();
 if(button.hasAttribute('data-day')){state.selected=Number(button.dataset.day);error('');render();remember();}
 if(button.hasAttribute('data-delete-period')){state.days[state.selected].periods.splice(Number(button.dataset.deletePeriod),1);changed();error('');render();}
 if(button.hasAttribute('data-close'))closeDialog();
 if(button.hasAttribute('data-step')){const input=$('#preset-temp');input.value=Math.min(35,Math.max(4,(Number(input.value)||20)+Number(button.dataset.step)));}
 if(button.id==='copy-day')showCopy();
 if(button.id==='add-period'){
 const periods=state.days[state.selected].periods;const sorted=[...periods].sort((a,b)=>minutes(a.start)-minutes(b.start));let start=0;for(const p of sorted){if(minutes(p.start)-start>=60)break;start=minutes(p.end);}if(start>1380){error(t('no_free_hour'));return;}periods.push({start:clock(start),end:clock(start+60),preset:state.presets[1]?.id||state.presets[0].id});periods.sort((a,b)=>minutes(a.start)-minutes(b.start));changed();error('');render();
 }
 if(button.id==='save-schedule'){dirty=false;state.applied=JSON.parse(JSON.stringify({presets:state.presets,days:state.days}));renderControl();icons();remember();$('#save-status').textContent=t('saved');}
});
root.addEventListener('change',e=>{
 if(e.target.id==='preview-language'){language=e.target.value;i18n=createLocalizer(catalogs,language);error('');render();remember();return;}
 const settingMap={'child-lock':'childLock','open-window':'openWindow','temperature-source':'source','frost-temperature':'frost'};
 if(settingMap[e.target.id]){
  const key=settingMap[e.target.id];
  if(key==='frost'){const value=Number(e.target.value);if(!Number.isFinite(value)||value<4||value>10||value*2!==Math.round(value*2)){e.target.value=state.control.frost;return;}state.control.frost=value;}
  else state.control[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;
  renderControl();icons();remember();return;
 }
 if(e.target.id==='base-temperature'){state.days[state.selected].base=e.target.value;changed();render();return;}
 const row=e.target.closest('[data-period]');if(!row)return;const i=Number(row.dataset.period);const periods=state.days[state.selected].periods;const draft=periods.map(p=>({...p}));let value=e.target.value;if(e.target.dataset.field==='end'&&value==='00:00')value='24:00';draft[i][e.target.dataset.field]=value;const issue=validate(draft);if(issue){error(issue);render();return;}state.days[state.selected].periods=draft.sort((a,b)=>minutes(a.start)-minutes(b.start));error('');changed();render();
});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialogKind)closeDialog();if(e.key==='Tab'&&dialogKind){const focusable=[...$('#dialog-layer').querySelectorAll('button,input,select')].filter(x=>!x.disabled);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent?.schedule;if(saved&&Array.isArray(saved.presets)&&saved.presets.length&&Array.isArray(saved.days)&&saved.days.length===7&&!dialogKind){state=saved;language=e.detail.globals.widgetState.privateContent.language||language;i18n=createLocalizer(catalogs,language);normalize();render();}});
render();
})();
</script>
