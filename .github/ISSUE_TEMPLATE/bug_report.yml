name: Bug report
description: Report a problem with the card.
body:
  - type: textarea
    attributes:
      label: Problem and reproduction
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Versions
      description: Card, Home Assistant, Zigbee2MQTT, valve firmware, and browser/app versions.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Configuration and logs
      description: Include relevant card YAML and browser errors. Remove tokens, addresses, and other private information.
  - type: textarea
    attributes:
      label: Screenshot
      description: A screenshot can help explain layout problems. Remove personal information before attaching it.
